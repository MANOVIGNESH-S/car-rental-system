services:
  db:
    image: postgres:15
    restart: always
    env_file:
      - ./backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: always

  backend:
    build: ./backend
    volumes:                  # <--- ADD THIS
      - ./backend:/app        # <--- ADD THIS
    command: uv run sh -c "alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
    restart: always

  celery_worker:
    build: ./backend
    volumes:                  # <--- 
      - ./backend:/app        # <--- ADD THIS
    command: uv run celery -A src.workers.celery_app worker --loglevel=info --pool=solo
    env_file:
      - ./backend/.env
    depends_on:
      - backend
      - redis
    restart: always

  celery_beat:
    build: ./backend
    volumes:                 
      - ./backend:/app        # <--- ADD THIS
    command: uv run celery -A src.workers.celery_app beat --loglevel=info
    env_file:
      - ./backend/.env
    depends_on:
      - backend
      - redis
    restart: always

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data: